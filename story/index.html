<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이야기</title>
<meta name="description" content="브랜드의 이야기를 기록합니다.">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/blog.css">
<script src="../assets/site.js" defer></script>
</head>
<!-- ═══════════════════════════════════════════════════════════
     이 파일은 "혼자서도 열리는" 독립 페이지입니다.
     내 사이트에 이식할 때는 아래 두 슬롯을 반드시 채우세요.
       ① HEADER 슬롯 : 홈페이지의 로고 + 네비게이션 + 모바일 메뉴를 그대로 복사
       ② FOOTER 슬롯 : 홈페이지의 푸터를 그대로 복사
     색·서체는 :root 의 CSS 변수를 홈페이지 값으로 바꾸면 됩니다.
     (본문 폭 --- .wrap 의 max-width 680px --- 은 가독성을 위해 유지 권장)
     ═══════════════════════════════════════════════════════════ -->
<body data-page="story"><a class="skip" href="#main">본문 바로가기</a><header class="header" data-header></header>

<!-- ⬇⬇⬇ ① HEADER 슬롯 — 내 홈페이지의 헤더/네비게이션을 여기에 붙여넣으세요 ⬇⬇⬇ -->
<!-- ⬆⬆⬆ ① HEADER 슬롯 끝 ⬆⬆⬆ -->

<div class="blog-wrap">
  <header class="site">
    <span aria-hidden="true"></span>
    <a class="admin-link" href="admin.html">관리</a>
  </header>
  <section class="blog-hero" id="main">
    <p class="eyebrow">Story</p>
    <h1>브랜드 이야기</h1>
    <p>만드는 사람들의 기록을 천천히 쌓아갑니다.</p>
  </section>
  <p class="notice">샘플 글 2개는 블로그 사용 예시이며 스노우밸리 코리아의 실제 사례가 아닙니다.</p><ul class="list" id="list"></ul>
</div>
<script>
(function(){
  var list = document.getElementById('list');

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function fmtDate(s){
    var d = new Date(s + 'T00:00:00');
    if (isNaN(d)) return s || '';
    return d.getFullYear() + '. ' + (d.getMonth()+1) + '. ' + d.getDate() + '.';
  }

  function render(posts){
    if (!Array.isArray(posts) || posts.length === 0){
      var empty = el('div','empty');
      empty.appendChild(el('strong', null, '아직 올라온 글이 없습니다'));
      empty.appendChild(document.createTextNode('첫 번째 이야기를 준비하고 있어요. 곧 만나요.'));
      list.replaceWith(empty);
      return;
    }
    posts = posts.slice().sort(function(a,b){
      return String(b.date||'').localeCompare(String(a.date||''));
    });
    posts.forEach(function(p){
      var li = el('li','card');
      var a = el('a');
      a.href = p.url ? String(p.url) : 'post.html?id=' + encodeURIComponent(p.id || '');
      var t = el('time', null, fmtDate(p.date));
      t.setAttribute('datetime', String(p.date||''));
      a.appendChild(t);
      a.appendChild(el('h2', null, String(p.title || '(제목 없음)')));
      if (p.summary) a.appendChild(el('p','summary', String(p.summary)));
      if (Array.isArray(p.tags) && p.tags.length){
        var tags = el('div','tags');
        p.tags.forEach(function(tg){ tags.appendChild(el('span','tag', String(tg))); });
        a.appendChild(tags);
      }
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  fetch('posts.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function(){
      list.replaceWith(el('div','error','글 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.'));
    });
})();
</script>

<!-- ⬇⬇⬇ ② FOOTER 슬롯 — 내 홈페이지의 푸터를 여기에 붙여넣으세요 ⬇⬇⬇ -->
<!-- ⬆⬆⬆ ② FOOTER 슬롯 끝 ⬆⬆⬆ -->

<footer class="footer" data-footer></footer></body>
</html>

<!-- ═══════════════════════════════════════════════════════════
     이 파일은 "혼자서도 열리는" 독립 페이지입니다.
     내 사이트에 이식할 때는 아래 두 슬롯을 반드시 채우세요.
       ① HEADER 슬롯 : 홈페이지의 로고 + 네비게이션 + 모바일 메뉴를 그대로 복사
       ② FOOTER 슬롯 : 홈페이지의 푸터를 그대로 복사
     색·서체는 :root 의 CSS 변수를 홈페이지 값으로 바꾸면 됩니다.
     (본문 폭 --- .wrap 의 max-width 680px --- 은 가독성을 위해 유지 권장)

     ③ 검색·AI 노출(SEO/AEO/GEO) 메모
       이 페이지는 posts.json 을 브라우저에서 읽어 그립니다. Google 은 읽지만
       ChatGPT·Perplexity 같은 AI 크롤러는 JS 를 실행하지 않아 글이 비어 보입니다.
       그래서 글마다 정적 파일(story/<slug>.html — 이 파일을 복제해 본문·메타·JSON-LD 를
       HTML 에 직접 써 넣은 것)을 두고, posts.json 의 해당 글에 "url": "<slug>.html" 을
       적어 주면 목록·홈 카드가 그 정적 페이지로 연결됩니다. (팁③ 예약 작업이 이 일을 매일 합니다)
       posts.json 글 필드: id·title·date·summary·tags·body (필수)
                          url·description·author·updated·faq[{q,a}]·sources[{title,url}] (선택)
     ═══════════════════════════════════════════════════════════ -->
<body data-page="story"><a class="skip" href="#main">본문 바로가기</a><header class="header" data-header></header>

<!-- ⬇⬇⬇ ① HEADER 슬롯 — 내 홈페이지의 헤더/네비게이션을 여기에 붙여넣으세요 ⬇⬇⬇ -->
<!-- ⬆⬆⬆ ① HEADER 슬롯 끝 ⬆⬆⬆ -->

<div class="blog-wrap">
  <div class="top"><a class="back" href="index.html">&larr; 목록으로</a></div>
  <main id="main"></main>
</div>
<script>
(function(){
  var main = document.getElementById('main');

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function fmtDate(s){
    var d = new Date(s + 'T00:00:00');
    if (isNaN(d)) return s || '';
    return d.getFullYear() + '. ' + (d.getMonth()+1) + '. ' + d.getDate() + '.';
  }

  // 초경량 마크다운: 빈 줄=문단, "## "=소제목, "- "=리스트. 전부 textContent로 삽입(XSS-safe).
  function renderBody(src){
    var box = el('div','body');
    var blocks = String(src || '').replace(/\r\n/g,'\n').split(/\n\s*\n/);
    blocks.forEach(function(block){
      block = block.trim();
      if (!block) return;
      var lines = block.split('\n');
      if (lines.every(function(l){ return /^- /.test(l.trim()); })){
        var ul = el('ul');
        lines.forEach(function(l){ ul.appendChild(el('li', null, l.trim().slice(2))); });
        box.appendChild(ul);
      } else if (/^## /.test(block)){
        box.appendChild(el('h2', null, block.slice(3).trim()));
      } else {
        box.appendChild(el('p', null, block));
      }
    });
    return box;
  }

  function notFound(){
    var d = el('div','notfound');
    d.appendChild(el('h1', null, '글을 찾을 수 없습니다'));
    d.appendChild(el('p', null, '주소가 잘못되었거나 삭제된 글일 수 있어요.'));
    var a = el('a', null, '글 목록으로 돌아가기');
    a.href = 'index.html';
    d.appendChild(a);
    main.appendChild(d);
  }

  function hrefOf(p){
    return p.url ? String(p.url) : 'post.html?id=' + encodeURIComponent(p.id || '');
  }

  function setAttr(sel, attr, val){
    var n = document.querySelector(sel);
    if (n) n.setAttribute(attr, val);
  }

  function addLd(obj){
    var ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify(obj);
    document.head.appendChild(ld);
  }

  function setMeta(post){
    var title = String(post.title || '이야기');
    var desc = String(post.description || post.summary || '').slice(0, 160);
    var url = location.origin + location.pathname + '?id=' + encodeURIComponent(post.id || '');
    var author = String(post.author || '').trim();
    document.title = title;
    setAttr('meta[name="description"]', 'content', desc);
    setAttr('meta[name="author"]', 'content', author);
    setAttr('link[rel="canonical"]', 'href', url);
    setAttr('meta[property="og:title"]', 'content', title);
    setAttr('meta[property="og:description"]', 'content', desc);
    setAttr('meta[property="og:url"]', 'content', url);

    var article = {
      '@context': 'https://schema.org',
      '@type': 'BlogPosting',
      headline: title,
      description: desc,
      datePublished: String(post.date || ''),
      dateModified: String(post.updated || post.date || ''),
      mainEntityOfPage: url,
      keywords: Array.isArray(post.tags) ? post.tags.map(String).join(', ') : ''
    };
    if (author) article.author = { '@type': 'Person', name: author };
    addLd(article);

    var faq = Array.isArray(post.faq) ? post.faq.filter(function(f){ return f && f.q && f.a; }) : [];
    if (faq.length){
      addLd({
        '@context': 'https://schema.org',
        '@type': 'FAQPage',
        mainEntity: faq.map(function(f){
          return { '@type': 'Question', name: String(f.q),
                   acceptedAnswer: { '@type': 'Answer', text: String(f.a) } };
        })
      });
    }
    addLd({
      '@context': 'https://schema.org',
      '@type': 'BreadcrumbList',
      itemListElement: [
        { '@type': 'ListItem', position: 1, name: '이야기', item: location.origin + location.pathname.replace(/post\.html$/, '') },
        { '@type': 'ListItem', position: 2, name: title, item: url }
      ]
    });
  }

  function renderFaq(faq){
    var sec = el('section','faq');
    sec.appendChild(el('h2', null, '자주 묻는 질문'));
    faq.forEach(function(f){
      var d = el('details');
      d.appendChild(el('summary', null, String(f.q)));
      d.appendChild(el('p', null, String(f.a)));
      sec.appendChild(d);
    });
    return sec;
  }

  function renderSources(sources){
    var sec = el('section','sources');
    sec.appendChild(el('h2', null, '참고·출처'));
    var ol = el('ol');
    sources.forEach(function(s){
      var li = el('li');
      if (s && s.url){
        var a = el('a', null, String(s.title || s.url));
        a.href = String(s.url); a.rel = 'noopener'; a.target = '_blank';
        li.appendChild(a);
      } else {
        li.textContent = String(s && s.title || s || '');
      }
      ol.appendChild(li);
    });
    sec.appendChild(ol);
    return sec;
  }

  function render(posts){
    var qs = new URLSearchParams(location.search);
    var id = qs.get('id') || qs.get('slug');
    posts = (Array.isArray(posts) ? posts : []).slice().sort(function(a,b){
      return String(b.date||'').localeCompare(String(a.date||''));
    });
    var idx = -1;
    posts.forEach(function(p,i){ if (String(p.id) === id || (p.url && String(p.url).replace(/\.html$/,'') === id)) idx = i; });
    if (idx < 0){ notFound(); return; }
    var post = posts[idx];
    setMeta(post);if(['first-story-20260829','behind-package-20260829'].includes(post.id)) main.appendChild(el('p','notice','키트 샘플 글입니다. 스노우밸리 코리아의 실제 이야기나 제품 개선 사례가 아닙니다.'));

    var art = el('article');
    var head = el('header','post-head');
    var t = el('time', null, fmtDate(post.date));
    t.setAttribute('datetime', String(post.date||''));
    head.appendChild(t);
    head.appendChild(el('h1', null, String(post.title || '(제목 없음)')));
    if (post.author || (post.updated && post.updated !== post.date)){
      var meta = el('div','meta');
      if (post.author) meta.appendChild(el('span', null, String(post.author)));
      if (post.updated && post.updated !== post.date) meta.appendChild(el('span', null, '수정 ' + fmtDate(post.updated)));
      head.appendChild(meta);
    }
    if (Array.isArray(post.tags) && post.tags.length){
      var tags = el('div','tags');
      post.tags.forEach(function(tg){ tags.appendChild(el('span','tag', String(tg))); });
      head.appendChild(tags);
    }
    art.appendChild(head);
    art.appendChild(el('hr','rule'));
    art.appendChild(renderBody(post.body));if(post.productUrl){var productLink=el('a','text-link','관련 제품 보기 ↗');productLink.href='../products.html';art.appendChild(productLink);}
    var faq = Array.isArray(post.faq) ? post.faq.filter(function(f){ return f && f.q && f.a; }) : [];
    if (faq.length) art.appendChild(renderFaq(faq));
    if (Array.isArray(post.sources) && post.sources.length) art.appendChild(renderSources(post.sources));

    var prev = posts[idx+1]; // 더 오래된 글
    var next = posts[idx-1]; // 더 최신 글
    if (prev || next){
      var nav = el('nav','pn');
      function cell(p, cls, label){
        if (!p){ nav.appendChild(el('span')); return; }
        var a = el('a', cls);
        a.href = hrefOf(p);
        a.appendChild(el('div','dir', label));
        a.appendChild(el('div','pn-title', String(p.title || '')));
        nav.appendChild(a);
      }
      cell(prev, 'prev', '이전 글');
      cell(next, 'next', '다음 글');
      art.appendChild(nav);
    }
    main.appendChild(art);
  }

  fetch('posts.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function(){ notFound(); });
})();
</script>

<!-- ⬇⬇⬇ ② FOOTER 슬롯 — 내 홈페이지의 푸터를 여기에 붙여넣으세요 ⬇⬇⬇ -->
